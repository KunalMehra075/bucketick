<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lost the trail: Page not found | Bucketick</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#ffbb00" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap"
    />
    <style>
      :root {
        --pink: #ff006e;
        --yellow: #ffbb00;
        --purple: #8b3dff;
        --ink: #18181b;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: 'Nunito', system-ui, -apple-system, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(60% 60% at 20% 10%, rgba(255, 187, 0, 0.18), transparent 60%),
          radial-gradient(55% 55% at 85% 90%, rgba(255, 0, 110, 0.16), transparent 60%),
          #fffdf8;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
      }
      .wrap {
        max-width: 520px;
      }
      .code {
        font-size: clamp(96px, 22vw, 180px);
        font-weight: 900;
        line-height: 0.9;
        letter-spacing: -0.04em;
        background: linear-gradient(120deg, var(--pink), var(--purple));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .spark {
        display: inline-block;
        width: 34px;
        height: 34px;
        color: var(--yellow);
        vertical-align: super;
      }
      h1 {
        margin-top: 12px;
        font-size: clamp(22px, 5vw, 30px);
        font-weight: 800;
      }
      p {
        margin-top: 12px;
        font-size: 16px;
        line-height: 1.6;
        color: #52525b;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 28px;
        padding: 13px 22px;
        border-radius: 999px;
        background: var(--ink);
        color: #fff;
        font-weight: 800;
        font-size: 15px;
        text-decoration: none;
        box-shadow: 0 10px 24px rgba(24, 24, 27, 0.18);
        transition: transform 0.15s ease;
      }
      .btn:hover {
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="code">
        404<span class="spark"
          ><svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true">
            <path d="M16 1C17 12 20 15 31 16 20 17 17 20 16 31 15 20 12 17 1 16 12 15 15 12 16 1Z" /></svg
        ></span>
      </div>
      <h1>This dream is not on any list yet</h1>
      <p>
        The page you were chasing wandered off somewhere. Happens to the best of us. Let's get you
        back to the part of Bucketick that actually exists.
      </p>
      <a class="btn" href="/">
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M19 12H5" />
          <path d="m12 19-7-7 7-7" />
        </svg>
        Back to home
      </a>
    </main>
  </body>
</html>
